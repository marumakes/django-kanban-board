<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kanban Board{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    /* Django renders form widgets as plain, unstyled <input>/<textarea> tags.
       These attribute selectors style them consistently without editing every form. */
    input[type="text"], input[type="password"], input[type="email"], textarea {
      background-color: #18181b; /* zinc-900 */
      border: 1px solid #3f3f46; /* zinc-700 */
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
      color: #f4f4f5; /* zinc-100 */
    }
    input::placeholder, textarea::placeholder {
      color: #71717a; /* zinc-500 */
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #10b981; /* emerald-500 */
      box-shadow: 0 0 0 1px #10b981;
    }
    label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #a1a1aa; /* zinc-400 */
      display: block;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    form p {
      margin-bottom: 0.75rem;
    }
    ul.errorlist {
      color: #f87171; /* red-400 */
      font-size: 0.75rem;
      list-style: none;
      padding: 0;
      margin: 0.25rem 0 0;
    }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
    <a href="{% url 'board_list' %}" class="font-bold text-lg text-emerald-400 tracking-tight">
      &gt;_ kanban
    </a>
    <div class="flex items-center gap-4">
      {% if user.is_authenticated %}
        <span class="text-sm text-zinc-400">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-sm text-zinc-400 hover:text-emerald-400">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="text-sm text-zinc-400 hover:text-emerald-400">Log in</a>
        <a href="{% url 'signup' %}" class="text-sm text-zinc-400 hover:text-emerald-400">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main class="p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
