<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kanban Board{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Django renders form widgets as plain, unstyled <input>/<textarea> tags.
       These attribute selectors style them consistently without editing every form. */
    input[type="text"], input[type="password"], input[type="email"], textarea {
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 1px #2563eb;
    }
    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      display: block;
      margin-bottom: 0.25rem;
    }
    form p {
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <a href="{% url 'board_list' %}" class="font-bold text-lg text-gray-800">Kanban</a>
    <div class="flex items-center gap-4">
      {% if user.is_authenticated %}
        <span class="text-sm text-gray-600">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-sm text-blue-600 hover:underline">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:underline">Log in</a>
        <a href="{% url 'signup' %}" class="text-sm text-blue-600 hover:underline">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main class="p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
