{% extends "base.html" %}
{% block title %}{{ card.title }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <a href="{% url 'board_detail' card.list.board_id %}" class="text-xs text-zinc-500 hover:text-emerald-400 transition-colors">
    &larr; Back to board
  </a>

  <div class="bg-zinc-800 border border-zinc-700/60 p-8 rounded-xl shadow-lg shadow-black/20 mt-3">
    <h1 class="text-xl font-semibold mb-5 text-zinc-100">Edit Card</h1>
    <form method="post" class="space-y-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="bg-emerald-600 text-white px-4 py-2.5 rounded-lg hover:bg-emerald-500 transition-colors text-sm font-medium shadow-lg shadow-emerald-950/40">
        Save
      </button>
    </form>

    <form method="post" action="{% url 'card_delete' card.id %}" class="mt-5 pt-5 border-t border-zinc-700/60"
          onsubmit="return confirm('Delete this card?');">
      {% csrf_token %}
      <button type="submit" class="text-red-400 text-sm hover:text-red-300 transition-colors">
        Delete card
      </button>
    </form>
  </div>
</div>
{% endblock %}
