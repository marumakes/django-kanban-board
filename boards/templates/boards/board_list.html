{% extends "base.html" %}
{% block title %}Your Boards{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-zinc-100">Your Boards</h1>
    <a href="{% url 'board_create' %}"
       class="bg-emerald-600 text-white text-sm font-medium px-4 py-2 rounded hover:bg-emerald-500">
      + New Board
    </a>
  </div>
  <ul class="space-y-2">
    {% for board in boards %}
    <li>
      <a href="{% url 'board_detail' board.id %}"
         class="block bg-zinc-900 border border-zinc-800 p-4 rounded-lg hover:border-emerald-600 transition-colors">
        <span class="text-lg font-medium text-zinc-100">{{ board.name }}</span>
      </a>
    </li>
    {% empty %}
    <li class="text-zinc-500 text-center py-12 border border-dashed border-zinc-800 rounded-lg">
      No boards yet — create your first one above.
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
