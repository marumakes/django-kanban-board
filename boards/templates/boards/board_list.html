{% extends "base.html" %}
{% block title %}Your Boards{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-semibold text-zinc-100">Your Boards</h1>
    <a href="{% url 'board_create' %}"
       class="bg-emerald-600 text-white text-sm font-medium px-4 py-2.5 rounded-lg hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-950/40">
      + New Board
    </a>
  </div>
  <ul class="space-y-3">
    {% for board in boards %}
    <li>
      <a href="{% url 'board_detail' board.id %}"
         class="block bg-zinc-800 border border-zinc-700/60 p-5 rounded-xl hover:border-emerald-600/70 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-black/20 transition-all">
        <span class="text-lg font-medium text-zinc-100">{{ board.name }}</span>
      </a>
    </li>
    {% empty %}
    <li class="text-zinc-500 text-center py-16 border border-dashed border-zinc-700/60 rounded-xl">
      No boards yet — create your first one above.
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
