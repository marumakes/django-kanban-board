{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 rounded-lg shadow">
  <h1 class="text-xl font-bold mb-4 text-gray-800">Log in</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Log in</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">
    No account? <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign up</a>
  </p>
</div>
{% endblock %}
