{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-lg shadow-lg">
  <h1 class="text-xl font-bold mb-4 text-zinc-100">Log in</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-500 text-sm font-medium">
      Log in
    </button>
  </form>
  <p class="text-sm text-zinc-500 mt-4">
    No account? <a href="{% url 'signup' %}" class="text-emerald-400 hover:underline">Sign up</a>
  </p>
</div>
{% endblock %}
