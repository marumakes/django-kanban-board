{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-zinc-800 border border-zinc-700/60 p-8 rounded-xl shadow-lg shadow-black/20">
  <h1 class="text-xl font-semibold mb-5 text-zinc-100">Log in</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-emerald-600 text-white px-4 py-2.5 rounded-lg hover:bg-emerald-500 transition-colors text-sm font-medium shadow-lg shadow-emerald-950/40">
      Log in
    </button>
  </form>
  <p class="text-sm text-zinc-500 mt-5">
    No account? <a href="{% url 'signup' %}" class="text-emerald-400 hover:underline">Sign up</a>
  </p>
</div>
{% endblock %}
